@keyframes kb{to{transform:scale(1.14) translate(-12px,-10px)}}
.tint,.shade,.sweep,.glow{position:absolute;inset:0;pointer-events:none}
.tint{background:var(--tint)}
.shade{background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 32%,rgba(0,0,0,.5))}
.sweep{background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.16) 50%,transparent 60%);animation:sw 7s linear infinite}
@keyframes sw{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.glow{box-shadow:inset 0 0 110px rgba(255,30,40,.95);opacity:0}
.t-rouge .glow{animation:al 1.2s ease-in-out infinite}
@keyframes al{0%,100%{opacity:.2}50%{opacity:.8}}
header,#dots,main{position:relative;z-index:1}
header{display:flex;justify-content:space-between;align-items:center}
.logo{background:#fff;border:0;border-radius:10px;padding:4px 8px;display:flex}
.cpt{font-size:12px;font-weight:700;letter-spacing:.14em}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0 4px}
.dots i{width:14px;height:6px;border-radius:3px;background:rgba(255,255,255,.35)}
.dots i.on{background:#fff}.dots i.cur{width:22px}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:10px;overflow-y:auto}
.screen[hidden]{display:none}
.screen.in>*{animation:ri .7s ease-out both}
@keyframes ri{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.disc{width:128px;height:128px;border-radius:50%;background:#fff;color:var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;animation:pu 2.4s ease-in-out infinite}
@keyframes pu{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,.55)}50%{transform:scale(1.05);box-shadow:0 0 0 18px transparent}}
.disc small{font:13px 'Special Elite',monospace;letter-spacing:.18em;color:#14213D}
.disc b{font:56px/1 'Special Elite',monospace}
.disc.ok{background:#1E9E57;color:#fff;font-size:64px}.disc.bad{background:#B3141E;color:#fff}
.pill{font-size:11px;font-weight:700;letter-spacing:.16em;border:1px solid rgba(255,255,255,.7);padding:3px 12px;border-radius:12px;text-align:center}
h1{font:400 23px/1.2 'Special Elite',monospace;text-align:center;margin:0}
.glass{width:100%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:16px 18px;font-size:15.5px;line-height:1.42;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.glass p{margin:0}.glass .cons{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.3);font-size:13px;font-style:italic}
.actions{width:100%;margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:8px}
.field{height:54px;border:0;border-radius:16px;padding:0 18px;background:rgba(255,255,255,.94);color:#14213D;font:17px 'Special Elite',monospace;letter-spacing:.2em;text-transform:uppercase;width:100%}
.btn{position:relative;overflow:hidden;height:56px;border:0;border-radius:28px;background:#fff;color:var(--acc);font:700 15px 'Source Sans 3',sans-serif;letter-spacing:.14em;box-shadow:0 8px 20px rgba(0,0,0,.3);width:100%}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%);transform:translateX(-100%);animation:sw 3.2s ease-in-out infinite}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
a.btn[hidden]{display:none}
.link{background:none;border:0;color:#fff;text-decoration:underline;font-size:13px;opacity:.85}
.hint{margin:0;text-align:center;font-size:14px;background:rgba(0,0,0,.35);border-radius:12px;padding:8px 12px}
.statut{background:#14213D;border-radius:14px;padding:10px 16px;font-weight:700;letter-spacing:.08em;font-size:14px;text-align:center}
/* rubans */
.slots,.tray{display:flex;gap:10px;justify-content:center;width:100%}
.slot{width:92px;height:122px;border-radius:18px;border:2px dashed rgba(255,255,255,.75);background:rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.slot.over{background:rgba(255,255,255,.3)}
.slot small{position:absolute;top:6px;font-size:11px;font-weight:700;letter-spacing:.12em}
.tray{min-height:100px;gap:26px}
.rub{display:flex;flex-direction:column;align-items:center;gap:4px;touch-action:none;cursor:grab;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.rub svg{width:48px;height:64px}
.rub b{width:28px;height:28px;border-radius:50%;background:#fff;color:#14213D;font:18px/28px 'Special Elite',monospace;text-align:center}
.tray .rub{animation:wg 2.2s ease-in-out infinite}
@keyframes wg{50%{transform:rotate(5deg) translateY(-6px)}}
.rub.drag{position:fixed;z-index:9;pointer-events:none;animation:none;transform:scale(1.2)}
.codeview{font:30px 'Special Elite',monospace;letter-spacing:.3em;background:rgba(255,255,255,.94);color:#14213D;border-radius:16px;padding:6px 22px}
/* scanner + confettis */
#scanner{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#scanner[hidden]{display:none}#cam{width:100%;max-height:70vh;object-fit:cover}
#scanner button{background:#fff;border:0;border-radius:20px;padding:10px 18px;font-weight:700}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
#confetti i{position:absolute;top:-20px;width:8px;height:14px;animation:fl linear infinite}
@keyframes fl{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* petits écrans : tout reste visible sans défiler */
@media (max-height:820px){.disc{width:100px;height:100px}.disc b{font-size:42px}.disc small{font-size:11px}.screen{gap:9px}.slot{height:104px;width:86px}.tray{min-height:84px}.glass{padding:13px 16px;font-size:15px}}
@media (max-height:820px){h1{font-size:21px}.screen{padding-top:4px}.slot{height:96px}.rub svg{width:40px;height:54px}.codeview{font-size:26px;padding:4px 18px}.btn{height:50px}.actions{gap:8px;padding-top:4px}}
@media (max-height:700px){.disc{width:84px;height:84px}.disc b{font-size:34px}.glass{font-size:14px}}
#s-rubans .disc{width:92px;height:92px}#s-rubans .disc b{font-size:38px}#s-rubans .disc small{font-size:11px}#s-rubans .slot{height:96px}#s-rubans .glass{padding:11px 14px;font-size:14px}
@media (max-height:700px){#s-rubans .disc{display:none}#s-rubans h1{font-size:19px}}

</style>
</head>
<body>
<div id="app" class="t-bleu">
  <div class="bg"></div><div class="tint"></div><div class="shade"></div><div class="sweep"></div><div class="glow"></div><div id="confetti"></div>
  <header>
    <!-- Appui long (1,5 s) sur le logo = recommencer le jeu -->
    <button id="logo" class="logo" aria-label="Logo"><svg role="img" aria-label="Logo détourné : l’Assurance Liberté, Rhône" width="104" height="47" viewBox="0 6 285 128" style="flex:none;margin-left:auto"><defs><path id="arc" d="M4 56Q46 2 146 16"/></defs><path d="M6 60H92" stroke="#8DB83B" stroke-width="1.5"/><path d="M6 70H92" stroke="#8DB83B" stroke-width="1.5"/><path d="M6 80H92" stroke="#8DB83B" stroke-width="1.5"/><path d="M6 90H92" stroke="#8DB83B" stroke-width="1.5"/><path d="M6 100H92" stroke="#8DB83B" stroke-width="1.5"/><path d="M6 110H92" stroke="#8DB83B" stroke-width="1.5"/><g fill="none" stroke="#1E6BB8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 78V94M11 108L16 94L22 108M16 82L28 76"/><path d="M48 68L40 92L22 110L8 112M40 92L56 108M47 72L28 80M47 72L70 70"/><path d="M54 36L34 46L18 42"/><path d="M82 70L80 96L76 112M80 96L86 112M82 74L68 72"/></g><g fill="#1E6BB8"><circle cx="16" cy="70" r="6"/><circle cx="48" cy="58" r="7.5"/><circle cx="60" cy="30" r="6.5"/><circle cx="82" cy="61" r="6.5"/></g><text font-family="Source Sans 3,sans-serif" font-size="8" font-weight="600" letter-spacing=".5" fill="#1E6BB8"><textPath href="#arc">EXFILTRATION SOCIALE</textPath></text><g font-family="Source Sans 3,sans-serif" font-weight="700"><text x="100" y="62" font-size="29" textLength="172" lengthAdjust="spacingAndGlyphs" fill="#1E6BB8">l’Assurance</text><text x="100" y="100" font-size="38" textLength="146" lengthAdjust="spacingAndGlyphs" fill="#1E6BB8">Liberté</text><text x="102" y="126" font-size="17" letter-spacing="2" fill="#5F8E13">RHÔNE</text></g></svg></button>
    <div class="cpt" data-f="compteur"></div>
  </header>
  <div id="dots" class="dots" hidden></div>
  <main>

    <!-- ÉCRAN 1 · ACCUEIL (étape 0) : champs data-f = titre, message ; bouton #btn-start -->
    <section class="screen" id="s-intro" hidden>
      <div class="disc"><small>DAM</small><b>69</b></div>
      <h1 data-f="titre"></h1>
      <div class="glass"><p data-f="message"></p><p class="cons" data-f="consigne"></p></div>
      <div class="actions"><button class="btn" id="btn-start">LANCER LE PROTOCOLE</button></div>
    </section>

    <!-- ÉCRAN 2 · MISSION À CODE (étapes 1, 2, 4 à 9) : champs = numero, phase, titre, message, consigne, indice ; #code, #btn-valider, #btn-indice -->
    <section class="screen" id="s-mission" hidden>
      <div class="disc"><small>MISSION</small><b data-f="numero"></b></div>
      <span class="pill" data-f="phase"></span>
      <h1 data-f="titre"></h1>
      <div class="glass"><p data-f="message"></p><p class="cons" data-f="consigne"></p></div>
      <div class="actions">
        <p class="hint" id="indice" data-f="indice" hidden></p>
        <input id="code" class="field" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ENTRE LE CODE" aria-label="Code">
        <button class="btn" id="btn-valider">VALIDER</button>
        <button class="link" id="btn-indice">Besoin d’un indice ?</button>
